name: Daily Short

on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Só gerar o guião (não renderiza nem publica)'
        type: boolean
        default: false
      pilar:
        description: 'Pilar da história'
        type: choice
        options: [auto, factos, historias, noticias]
        default: auto
      tema:
        description: 'Tema manual (opcional)'
        required: false
        default: ''
  schedule:
    - cron: '0 16 * * *'   # todos os dias às 16h UTC

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PREVIEW: ${{ inputs.preview }}
      PILAR: ${{ inputs.pilar }}
      TEMA: ${{ inputs.tema }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Escolher e escrever a história
        id: story
        run: python pick_story.py

      - name: Instalar ffmpeg e fontes
        if: steps.story.outputs.skip != 'true' && env.PREVIEW != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Carregar o payload
        if: steps.story.outputs.skip != 'true' && env.PREVIEW != 'true'
        run: |
          echo "PAYLOAD<<__EOF__" >> "$GITHUB_ENV"
          cat payload.json >> "$GITHUB_ENV"
          echo "__EOF__" >> "$GITHUB_ENV"

      - name: Renderizar vídeo e publicar no YouTube
        if: steps.story.outputs.skip != 'true' && env.PREVIEW != 'true'
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python make_video.py

      - name: Guardar histórico e banco de ideias
        if: always() && steps.story.conclusion == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
          else
            git commit -m "dados: atualização automática"
            git pull --rebase
            git push
          fi
